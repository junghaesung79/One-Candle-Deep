<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>원 캔들 딥 - 2차 프로토타입</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 숫자 폰트(03 3.6): Press Start 2P. 불러오지 못하면 아래 글꼴 목록의 시스템 폰트로 대체된다. 한글은 시스템 폰트 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #0b0a10; overflow: hidden; }
  body { font-family: "Galmuri11", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", sans-serif; color: #f1ece2; }
  #stage { position: absolute; width: 1280px; height: 720px; background: #14121a; transform-origin: 0 0; box-sizing: border-box; user-select: none; overflow: hidden; }
  .px { font-family: "Press Start 2P", Consolas, Menlo, "Courier New", monospace; font-weight: 400; letter-spacing: 0; }
  .panel { background: #1d1a24; border: 2px solid #34303f; box-sizing: border-box; }
  .muted { color: #a59fb3; } .sub { color: #c9c3d6; } .acc { color: #ffd25a; } .warnTxt { color: #e5484d; }
  img.pix { image-rendering: pixelated; image-rendering: crisp-edges; display: inline-block; vertical-align: middle; }
  .abs { position: absolute; box-sizing: border-box; }
  /* 머리 */
  #hdr { left: 40px; top: 8px; width: 728px; height: 48px; display: flex; align-items: center; gap: 12px; }
  #floorName { font-size: 22px; font-weight: 700; color: #ffd25a; white-space: nowrap; }
  #sign { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: #2a2018; border: 2px solid #5a3d28; padding: 3px 8px; height: 44px; box-sizing: border-box; }
  #sign .nm { font-size: 15px; font-weight: 700; color: #ffd25a; white-space: nowrap; }
  #sign .tx { font-size: 14px; color: #efe7d6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sign .badge { margin-left: 6px; }
  #hdrRight { display: flex; align-items: center; gap: 8px; }
  #dayTxt { font-size: 14px; font-weight: 700; text-align: right; line-height: 17px; white-space: nowrap; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; background: #3a0f14; border: 1px solid #c4432b; color: #f1ece2; padding: 0 5px; line-height: 17px; white-space: nowrap; }
  .badge.gold { background: #3a3220; border-color: #a8781c; color: #ffd25a; }
  #tally { left: 20px; top: 64px; width: 16px; height: 528px; image-rendering: pixelated; }
  #boardWrap { left: 40px; top: 60px; width: 728px; height: 536px; border: 4px solid #2a2633; }
  #board { display: block; width: 720px; height: 528px; image-rendering: pixelated; cursor: pointer; }
  #legend { left: 40px; top: 600px; width: 728px; height: 26px; display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 0 10px; }
  #legend .sep { color: #34303f; }
  #legend.flash { border-color: #ffd25a; }
  #orderLine { left: 40px; top: 630px; width: 728px; height: 20px; font-size: 13px; padding: 0 10px; line-height: 20px; color: #c9c3d6; white-space: nowrap; overflow: hidden; }
  #log { left: 40px; top: 652px; width: 728px; height: 52px; padding: 3px 10px; font-size: 14px; line-height: 22px; }
  #log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 오른쪽 */
  #pocketBox { left: 808px; top: 12px; width: 432px; height: 100px; padding: 6px 12px; border-style: dashed; }
  #pocketBox.danger { border-color: #c4432b; }
  #pocketBox.blink { border-color: #ffd25a; }
  .prow { display: flex; align-items: center; gap: 8px; }
  #pocketVal { font-size: 22px; margin-left: auto; color: #f2c14e; }
  #goalTxt { font-size: 14px; margin: 3px 0 4px; white-space: nowrap; overflow: hidden; }
  #vaultTxt { font-size: 14px; white-space: nowrap; }
  #payBar { flex: 1; height: 10px; background: #2a2633; position: relative; border: 1px solid #34303f; }
  #payBar i { position: absolute; top: 0; bottom: 0; left: 0; }
  #payBar .v { background: #b87333; } #payBar .p { background: repeating-linear-gradient(90deg, #f2c14e 0 4px, transparent 4px 6px); }
  #candleBox { left: 808px; top: 120px; width: 432px; height: 88px; padding: 6px 12px; display: flex; gap: 10px; align-items: center; }
  #candleCv { width: 48px; height: 48px; image-rendering: pixelated; flex: none; }
  #candleMain { flex: 1; position: relative; }
  #candleVal { font-size: 22px; color: #ffd25a; }
  #candleBar { position: relative; width: 320px; height: 10px; background: #2a2633; margin: 4px 0 4px; }
  #candleBar i { position: absolute; left: 0; top: 0; bottom: 0; background: #ffd25a; transition: width 0.12s linear; }
  #candleBar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #a59fb3; }
  #candleCost { font-size: 12.5px; color: #a59fb3; white-space: nowrap; }
  #embersRow { display: none; align-items: center; gap: 3px; margin: 2px 0; }
  #streakBox { left: 808px; top: 216px; width: 280px; height: 56px; padding: 4px 10px; }
  #streakVal { font-size: 16px; color: #f1ece2; white-space: nowrap; margin-left: auto; }
  #streakSteps { display: flex; gap: 3px; flex: none; }
  #streakSteps i { width: 26px; height: 8px; background: #2a2633; border: 1px solid #34303f; }
  #streakSteps i.on { background: #ffb347; border-color: #ff8a3d; }
  #streakNext { font-size: 12px; color: #a59fb3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #streakBox.broke { border-color: #a59fb3; }
  #streakBox.max { border-color: #ffd25a; }
  #hpBox { left: 1096px; top: 216px; width: 144px; height: 56px; padding: 4px 8px; }
  #hearts { display: flex; gap: 4px; }
  #toolsBox { left: 808px; top: 280px; width: 432px; height: 140px; padding: 5px 10px; }
  .lbl { font-size: 12.5px; font-weight: 700; color: #a59fb3; }
  .slots { display: flex; gap: 6px; margin: 3px 0 5px; }
  .slot { width: 48px; height: 48px; background: #2a2633; border: 2px solid #34303f; box-sizing: border-box; display: flex; align-items: center; justify-content: center; position: relative; transition: transform 0.08s; }
  .slot.empty { border-style: dashed; background: transparent; }
  .slot.pop { transform: translateY(-3px); border-color: #ffd25a; }
  .uslot { width: 77px; height: 40px; line-height: 13px; font-size: 11px !important; background: #2a2633; border: 2px solid #34303f; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 4px; font-size: 12px; font-weight: 700; color: #f1ece2; cursor: pointer; }
  .uslot .k { display: none; }
  .uslot.on { border-color: #ffd25a; background: #3a3220; color: #ffd25a; }
  .uslot.off { color: #5d5868; cursor: default; }
  #descBox { left: 808px; top: 428px; width: 432px; height: 122px; padding: 5px 10px; font-size: 12.5px; line-height: 17px; overflow: hidden; }
  #descBox b { color: #ffd25a; }
  #bReturn { left: 808px; top: 556px; width: 432px; height: 40px; font-size: 14px; position: absolute; overflow: hidden; }
  #bReturn .gauge { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255,210,90,0.25); }
  #bReturn.hot { border-color: #c4432b; }
  #help { left: 808px; top: 602px; width: 432px; height: 102px; font-size: 12px; line-height: 16.5px; color: #a59fb3; padding: 4px 10px; }
  #help b { color: #c9c3d6; }
  #help .dbg { color: #6f6880; }
  button { font-family: inherit; font-size: 14px; font-weight: 700; color: #f1ece2; background: #2a2633; border: 2px solid #34303f; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: #ffd25a; }
  button:disabled { color: #5d5868; border-color: #2a2633; cursor: default; }
  button.primary { background: #3a3220; border-color: #a8781c; color: #ffd25a; }
  #fxLayer { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .pop .tname { font-size: 0.8em; }
  .pop .tname.t2 { color: #7fe9ef; }
  .pop .tname.t3 { color: #ffb3a1; }
  .pop { position: absolute; font-weight: 700; white-space: nowrap; text-shadow: 2px 2px 0 #1a120b; transform: translate(-50%, -50%); font-family: Consolas, Menlo, monospace; }
  .bubble { position: absolute; z-index: 6; background: #efe7d6; color: #1a120b; border: 2px solid #3a3542; font-size: 15px; font-weight: 700; padding: 6px 10px; max-width: 400px; line-height: 20px; box-shadow: 3px 3px 0 #0b0a10; pointer-events: none; }
  .bubble:after { content: ''; position: absolute; width: 0; height: 0; border: 8px solid transparent; }
  .bubble.tb:after { left: 18px; bottom: -16px; border-top-color: #3a3542; }
  .bubble.tt:after { left: 18px; top: -16px; border-bottom-color: #3a3542; }
  /* 오버레이 */
  #ov { position: absolute; inset: 0; display: none; z-index: 8; }
  #termTip { position: absolute; z-index: 30; display: none; max-width: 300px; padding: 7px 10px; background: #1d1a24; border: 2px solid #a8781c; color: #f1ece2; font-size: 13px; line-height: 19px; pointer-events: none; }
  [data-term] { cursor: help; }
  [data-term] .termDot, .lbl[data-term] { text-decoration: underline dotted #6b6578; text-underline-offset: 3px; }
  .vein { display: inline-grid; grid-template-columns: repeat(5, 12px); gap: 1px; margin: 6px 0 2px; }
  .vein i { width: 12px; height: 12px; background: #3a3542; display: block; font-style: normal; font-size: 9px; line-height: 12px; text-align: center; color: #c9c3d6; }
  .vein i.o { background: #6b5320; } .vein i.g { background: #5fe0e8; } .vein i.m { background: #c4432b; } .vein i.x { background: #26222e; color: #8a8496; }
  #ov.show { display: block; }
  .dim { position: absolute; inset: 0; background: rgba(11,10,16,0.82); }
  .dlg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #1d1a24; border: 2px solid #34303f; padding: 18px 24px; box-sizing: border-box; }
  .dlg h2 { margin: 0 0 10px; font-size: 21px; color: #ffd25a; }
  .dlg h3 { margin: 8px 0 4px; font-size: 14px; color: #a59fb3; }
  .row { display: flex; justify-content: space-between; gap: 16px; font-size: 15px; line-height: 24px; }
  .fadein { opacity: 0; animation: fin 0.15s forwards; }
  .instant .fadein { animation-duration: 0s !important; animation-delay: 0s !important; }
  @keyframes fin { to { opacity: 1; } }
  .note { font-size: 13px; color: #a59fb3; }
  .quote { font-size: 15px; color: #c9c3d6; margin: 8px 0; }
  .card { padding: 8px 10px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .card .ic { width: 40px; height: 40px; background: #2a2633; display: flex; align-items: center; justify-content: center; flex: none; }
  .card .t { flex: 1; min-width: 0; }
  .card .n { font-size: 15px; font-weight: 700; }
  .card .d { font-size: 13px; color: #c9c3d6; margin-top: 2px; }
  .card .p { font-size: 16px; font-weight: 700; color: #ffd25a; min-width: 50px; text-align: right; }
  .card.sold { opacity: 0.45; cursor: default; }
  .card.sel { border-color: #ffd25a; }
  .fork { flex: 1; padding: 14px; cursor: pointer; min-height: 196px; position: relative; }
  .fork.sel { border-color: #ffd25a; background: #26222e; }
  .fork .nm { font-size: 19px; font-weight: 700; margin: 8px 0 4px; }
  .fork .tx { font-size: 15px; color: #efe7d6; line-height: 21px; }
  .fork .hp2 { font-size: 13px; color: #a59fb3; margin-top: 8px; line-height: 18px; }
  .fork .first { position: absolute; right: 8px; top: 8px; }
  .paper { background: #efe7d6; color: #1a120b; border: 2px solid #5a3d28; padding: 10px 12px; position: relative; cursor: pointer; }
  .paper.sel { outline: 3px solid #ffd25a; }
  .paper .pinI { position: absolute; left: 50%; top: -8px; transform: translateX(-50%); }
  .deedCard { background: #e9dfc8; color: #3a3542; border: 3px solid #3a3542; padding: 14px 18px; position: relative; }
  .deedCard .ttl { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .stampRow { display: flex; align-items: center; gap: 12px; font-size: 16px; margin: 6px 0; }
  .stampSlot { width: 46px; height: 46px; border: 2px dashed #a59fb3; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; position: relative; }
  .stamp { width: 44px; height: 44px; border-radius: 50%; border: 3px solid #b8322a; color: #b8322a; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; transform: rotate(-12deg); box-sizing: border-box; background: rgba(184,50,42,0.08); }
  .stamp.fall { animation: stampFall 0.38s ease-in forwards; }
  @keyframes stampFall { 0% { transform: rotate(-12deg) translateY(-60px) scale(1.6); opacity: 0; } 55% { transform: rotate(-12deg) translateY(0) scale(1); opacity: 1; } 70% { transform: rotate(-12deg) scale(1.08); } 100% { transform: rotate(-12deg) scale(1); opacity: 1; } }
  .voidLine { position: absolute; left: 14px; right: 14px; height: 4px; background: #e5484d; transform-origin: left; animation: strike 0.15s linear forwards; transform: scaleX(0); }
  @keyframes strike { to { transform: scaleX(1); } }
  .chart { display: flex; align-items: flex-end; gap: 4px; height: 90px; border-bottom: 2px solid #34303f; margin: 8px 0 2px; }
  .chart i { flex: 1; background: #b87333; min-height: 2px; position: relative; }
  .chart i.col { background: repeating-linear-gradient(45deg, #5d5868 0 3px, #2a2633 3px 6px); }
  .chart i.pay { outline: 2px solid #ffd25a; }
  .kbd { display: none !important; border: 1px solid #a59fb3; border-bottom-width: 3px; padding: 0 4px; font-size: 12px; line-height: 15px; color: #f1ece2; background: #2a2633; font-family: Consolas, Menlo, monospace; }
  #cmodal { position: absolute; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(5,4,8,0.72); }
  #cmodal .box { min-width: 340px; max-width: 480px; background: #1d1a24; border: 2px solid #34303f; padding: 18px 22px; font-size: 15px; line-height: 1.6; }
</style>
</head>
<body>
<div id="stage">
  <div id="hdr" class="abs">
    <div id="floorName" data-term="지하 층">지하 <span class="px">1</span>층</div>
    <div id="sign" data-term="광맥"><span id="signIc"></span><div style="min-width:0"><div class="nm" id="signName"></div><div class="tx" id="signText"></div></div></div>
    <div id="hdrRight"><span id="mutIcons"></span><span id="stairSt"></span><div id="dayTxt"></div><div id="moonWrap"></div></div>
  </div>
  <canvas id="tally" class="abs" width="16" height="528"></canvas>
  <div id="boardWrap" class="abs"><canvas id="board" width="720" height="528" aria-label="탑다운 채굴 판"></canvas></div>
  <div id="legend" class="abs panel"></div>
  <div id="orderLine" class="abs"></div>
  <div id="log" class="abs panel"></div>

  <div id="pocketBox" class="abs panel">
    <div class="prow"><span id="pouchIc"></span><span class="lbl" style="font-size:14px;color:#f1ece2" data-term="오늘 주머니">오늘 주머니</span><span id="pocketBadge"></span><span id="pocketVal" class="px">0</span></div>
    <div id="goalTxt" data-term="도장"></div>
    <div class="prow"><span id="coinsIc"></span><span id="vaultTxt" data-term="금고"></span><div id="payBar"><i class="v"></i><i class="p"></i></div></div>
  </div>
  <div id="candleBox" class="abs panel">
    <canvas id="candleCv" width="24" height="24"></canvas>
    <div id="candleMain">
      <div class="prow"><span class="lbl" style="font-size:14px;color:#f1ece2" data-term="촛불">촛불</span><span id="candleVal" class="px">80</span><span id="awakeBadge"></span></div>
      <div id="candleBar"><i></i><b></b></div>
      <div id="embersRow"></div>
      <div id="candleCost"></div>
    </div>
  </div>
  <div id="streakBox" class="abs panel">
    <div class="prow" style="height:22px"><canvas id="flameCv" width="10" height="10" style="width:20px;height:20px;image-rendering:pixelated"></canvas><span class="lbl" data-term="콤보">콤보</span><span id="streakVal" class="px">×1</span></div>
    <div class="prow" style="margin-top:4px"><div id="streakSteps"></div><div id="streakNext"></div></div>
  </div>
  <div id="hpBox" class="abs panel"><div class="lbl" data-term="체력">체력</div><div id="hearts"></div></div>
  <div id="toolsBox" class="abs panel">
    <div class="lbl" id="ownLbl" data-term="가진 도구">가진 도구 0/5</div>
    <div class="slots" id="ownSlots"></div>
    <div class="lbl" data-term="버튼으로 쓰는 것">버튼으로 쓰는 것</div>
    <div class="slots" id="useSlots"></div>
  </div>
  <div id="descBox" class="abs panel"></div>
  <button id="bReturn" class="abs"><span class="gauge"></span><span style="position:relative">올라가기</span></button>
  <div id="help" class="abs panel"></div>
  <div id="fxLayer"></div>
  <div id="termTip"></div>
  <div id="ov"></div>
  <div id="cmodal" role="dialog" aria-modal="true"><div class="box"><div id="cmodalMsg" style="margin-bottom:16px"></div><div style="display:flex;gap:10px;justify-content:flex-end"><button id="cmodalNo">아니요</button><button id="cmodalOk" class="primary">네</button></div></div></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
