  button { font-family: inherit; font-size: 14px; font-weight: 700; color: #f1ece2; background: #2a2633; border: 2px solid #34303f; padding: 6px 12px; cursor: pointer; }

  .bubble { position: absolute; z-index: 6; background: #efe7d6; color: #1a120b; border: 2px solid #3a3542; font-size: 15px; font-weight: 700; padding: 6px 10px; max-width: 400px; line-height: 20px; box-shadow: 3px 3px 0 #0b0a10; pointer-events: none; }
  .bubble:after { content: ''; position: absolute; width: 0; height: 0; border: 8px solid transparent; }
  .bubble.tb:after { left: 18px; bottom: -16px; border-top-color: #3a3542; }
  .bubble.tt:after { left: 18px; top: -16px; border-bottom-color: #3a3542; }
  /* 오버레이 */
  #ov { position: absolute; inset: 0; display: none; z-index: 8; }
  #ov.show { display: block; }
  .dim { position: absolute; inset: 0; background: rgba(11,10,16,0.82); }
  .dlg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #1d1a24; border: 2px solid #34303f; padding: 18px 24px; box-sizing: border-box; }

  .dlg h3 { margin: 8px 0 4px; font-size: 14px; color: #a59fb3; }
  .row { display: flex; justify-content: space-between; gap: 16px; font-size: 15px; line-height: 24px; }
  .fadein { opacity: 0; animation: fin 0.15s forwards; }
  .instant .fadein { animation-duration: 0s !important; animation-delay: 0s !important; }
  @keyframes fin { to { opacity: 1; } }
  .note { font-size: 13px; color: #a59fb3; }
  .quote { font-size: 15px; color: #c9c3d6; margin: 8px 0; }
  .card { padding: 8px 10px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .card .ic { width: 40px; height: 40px; background: #2a2633; display: flex; align-items: center; justify-content: center; flex: none; }
  .card .t { flex: 1; min-width: 0; }
  .card .n { font-size: 15px; font-weight: 700; }
  .card .d { font-size: 13px; color: #c9c3d6; margin-top: 2px; }
  .card .p { font-size: 16px; font-weight: 700; color: #ffd25a; min-width: 50px; text-align: right; }
  .card.sold { opacity: 0.45; cursor: default; }
  .card.sel { border-color: #ffd25a; }
  .fork { flex: 1; padding: 14px; cursor: pointer; min-height: 196px; position: relative; }
  .fork.sel { border-color: #ffd25a; background: #26222e; }
  .fork .nm { font-size: 19px; font-weight: 700; margin: 8px 0 4px; }
  .fork .tx { font-size: 15px; color: #efe7d6; line-height: 21px; }
  .fork .hp2 { font-size: 13px; color: #a59fb3; margin-top: 8px; line-height: 18px; }
  .fork .first { position: absolute; right: 8px; top: 8px; }
  .paper { background: #efe7d6; color: #1a120b; border: 2px solid #5a3d28; padding: 10px 12px; position: relative; cursor: pointer; }
  .paper.sel { outline: 3px solid #ffd25a; }
  .paper .pinI { position: absolute; left: 50%; top: -8px; transform: translateX(-50%); }
  .deedCard { background: #e9dfc8; color: #3a3542; border: 3px solid #3a3542; padding: 14px 18px; position: relative; }
  .deedCard .ttl { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .stampRow { display: flex; align-items: center; gap: 12px; font-size: 16px; margin: 6px 0; }
  .stampSlot { width: 46px; height: 46px; border: 2px dashed #a59fb3; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; position: relative; }
  .stamp { width: 44px; height: 44px; border-radius: 50%; border: 3px solid #b8322a; color: #b8322a; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; transform: rotate(-12deg); box-sizing: border-box; background: rgba(184,50,42,0.08); }
  .stamp.fall { animation: stampFall 0.38s ease-in forwards; }
  @keyframes stampFall { 0% { transform: rotate(-12deg) translateY(-60px) scale(1.6); opacity: 0; } 55% { transform: rotate(-12deg) translateY(0) scale(1); opacity: 1; } 70% { transform: rotate(-12deg) scale(1.08); } 100% { transform: rotate(-12deg) scale(1); opacity: 1; } }
  .voidLine { position: absolute; left: 14px; right: 14px; height: 4px; background: #e5484d; transform-origin: left; animation: strike 0.15s linear forwards; transform: scaleX(0); }
  @keyframes strike { to { transform: scaleX(1); } }
  .chart { display: flex; align-items: flex-end; gap: 4px; height: 90px; border-bottom: 2px solid #34303f; margin: 8px 0 2px; }
  .chart i { flex: 1; background: #b87333; min-height: 2px; position: relative; }
  .chart i.col { background: repeating-linear-gradient(45deg, #5d5868 0 3px, #2a2633 3px 6px); }
  .chart i.pay { outline: 2px solid #ffd25a; }
  .kbd { display: none !important; border: 1px solid #a59fb3; border-bottom-width: 3px; padding: 0 4px; font-size: 12px; line-height: 15px; color: #f1ece2; background: #2a2633; font-family: Consolas, Menlo, monospace; }
  #cmodal { position: absolute; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(5,4,8,0.72); }
  #cmodal .box { min-width: 340px; max-width: 480px; background: #1d1a24; border: 2px solid #34303f; padding: 18px 22px; font-size: 15px; line-height: 1.6; }
</style>

<body>
<div id="stage">
  <div id="hdr" class="abs">
    <div id="floorName">지하 <span class="px">1</span>층</div>
    <div id="sign" title="표지판을 누르면 보조 설명"><span id="signIc"></span><div style="min-width:0"><div class="nm" id="signName"></div><div class="tx" id="signText"></div></div></div>
    <div id="hdrRight"><span id="mutIcons"></span><span id="stairSt"></span><div id="dayTxt"></div><div id="moonWrap"></div></div>
  </div>
  <canvas id="tally" class="abs" width="16" height="528"></canvas>
  <div id="boardWrap" class="abs"><canvas id="board" width="720" height="528" aria-label="탑다운 채굴 판"></canvas></div>
  <div id="legend" class="abs panel"></div>
  <div id="orderLine" class="abs"></div>
  <div id="log" class="abs panel"></div>

  <div id="pocketBox" class="abs panel">
    <div class="prow"><span id="pouchIc"></span><span class="lbl" style="font-size:14px;color:#f1ece2">오늘 주머니</span><span id="pocketBadge"></span><span id="pocketVal" class="px">0</span></div>
    <div id="goalTxt"></div>
    <div class="prow"><span id="coinsIc"></span><span id="vaultTxt"></span><div id="payBar"><i class="v"></i><i class="p"></i></div></div>
  </div>
  <div id="candleBox" class="abs panel">
    <canvas id="candleCv" width="24" height="24"></canvas>
    <div id="candleMain">
      <div class="prow"><span class="lbl" style="font-size:14px;color:#f1ece2">촛불</span><span id="candleVal" class="px">80</span><span id="awakeBadge"></span></div>
      <div id="candleBar"><i></i><b></b></div>
      <div id="embersRow"></div>
      <div id="candleCost"></div>
    </div>
  </div>
  <div id="streakBox" class="abs panel">
    <div class="prow" style="height:22px"><canvas id="flameCv" width="10" height="10" style="width:20px;height:20px;image-rendering:pixelated"></canvas><span class="lbl">노다지 줄</span><span id="streakVal" class="px">×1</span></div>
    <div class="prow" style="margin-top:4px"><div id="streakSteps"></div><div id="streakNext"></div></div>
  </div>
  <div id="hpBox" class="abs panel"><div class="lbl">체력</div><div id="hearts"></div></div>
  <div id="toolsBox" class="abs panel">
    <div class="lbl" id="ownLbl">장착 도구 0/5</div>
    <div class="slots" id="ownSlots"></div>
    <div class="lbl">쓰는 칸</div>
    <div class="slots" id="useSlots"></div>
  </div>
  <div id="descBox" class="abs panel"></div>
  <button id="bReturn" class="abs"><span class="gauge"></span><span style="position:relative">올라가기</span></button>
  <div id="help" class="abs panel"></div>
  <div id="fxLayer"></div>
  <div id="ov"></div>
  <div id="cmodal" role="dialog" aria-modal="true"><div class="box"><div id="cmodalMsg" style="margin-bottom:16px"></div><div style="display:flex;gap:10px;justify-content:flex-end"><button id="cmodalNo">아니요</button><button id="cmodalOk" class="primary">네</button></div></div></div>
</div>
<script>
// ==CORE BEGIN==
// 순수 로직. DOM을 쓰지 않는다. node(bot.js, test_core.js)가 이 구간만 잘라 실행한다.
// 규칙 기준: 00d_round2_decisions.md(R1~R23), 11_fun_redesign.md 3장. 문구: 02_narrative.md 2차본 6~7장.
// 경제 수치(납부액, 보물 값, 도구 가격, 주문 보상)는 전부 임시값이다. 경제 담당이 CONFIG만 바꾸면 되게 모았다.
var CONFIG = {
  W: 15, H: 11,
  START: { x: 7, y: 5 },
  days: 15,
  payments: [
    { day: 3, name: '계약금', amount: 300 },     // 05 v0.3 3장. 등급 1. 등급 배수는 CONFIG.gradeMul
    { day: 8, name: '중도금', amount: 2400 },     // 덤·선물 반영 뒤 재측정(05 3.2)
    { day: 15, name: '잔금', amount: 11000 }      // 덤·선물 반영 뒤 재측정(05 3.2)
  ],
  // 촛불(R2)
  candleMax: 80, hitCost: 1, awakeHitCost: 2, travelBase: 2, probeCost: 2, probesPerDay: 2, igniteCost: 4,   // R27 점화 촛불 4
  lowLight: 15, lowLightRadius: 2.5,         // R19: 촛불 15 이하만 반경 2.5, 이미 본 숫자는 흐리게
  embers: 5,                                 // R4 불씨 다섯 번
  hpMax: 3, mineDmg: 1, collapseLoss: 0.5,   // R5 쓰러지면 주머니 절반
  // 노다지 줄(R8)
  streakLadder: [1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5], streakCapIdx: 4, streakCapIdxLastCard: 8,
  // 판
  numberCap: 5, startChainMin: 12, genRetries: 60,
  density: [ // 깊이 1~9: 지뢰 m, 보물 t, 보물 등급 가중치(금 알갱이/청록 보석/유물), 자갈 출현율 res, 자갈 값 rv
    { m: 13, t: 8,  tiers: [90, 10, 0],  res: 0.25, rv: 1 },
    { m: 14, t: 8,  tiers: [80, 20, 0],  res: 0.25, rv: 1 },
    { m: 15, t: 9,  tiers: [70, 28, 2],  res: 0.25, rv: 1 },
    { m: 16, t: 9,  tiers: [55, 38, 7],  res: 0.25, rv: 1 },
    { m: 17, t: 10, tiers: [45, 43, 12], res: 0.25, rv: 1 },
    { m: 18, t: 10, tiers: [35, 47, 18], res: 0.25, rv: 1 },
    { m: 19, t: 11, tiers: [28, 50, 22], res: 0.25, rv: 1 },
    { m: 20, t: 11, tiers: [22, 50, 28], res: 0.25, rv: 1 },
    { m: 21, t: 12, tiers: [18, 50, 32], res: 0.25, rv: 1 }
  ],
  treasureNearMine: 0.5,
  treasureValue: { 1: 20, 2: 50, 3: 120 },    // 금 알갱이 / 청록 보석 / 유물(시세 ×1 기준). 05 2.2
  scorchMul: 0.5,
  // 납부일 큰 덩이(R7). depth = 묻히는 층
  chunks: { 3: { depth: 3, w: 2, h: 2, value: 60 }, 8: { depth: 5, w: 2, h: 2, value: 160 }, 15: { depth: 5, w: 3, h: 2, value: 260 } },   // R31 Day 15 덩이 지하 5층   // 값에 시세가 붙는다(실제 60 / 240 / 780)
  mutationCount: { 8: 1, 15: 2 },
  roomsPerDay: { one: 0.5 },                 // 하루 1번(50%) 또는 2번(50%)
  shop: { tools: 3, cons: 2, reroll: 20, sellBack: 0.5, passiveSlots: 5, consSlots: 3, stack: 3,   // 값은 판 내내 고정(시세가 붙지 않는다)
          merchantDiscount: 0, merchantService: { price: 50, candle: 10 },
          rarityWeight: { '일반': 50, '고급': 35, '희귀': 15 } },
  spring: { hp: 1, candle: 15 },

function moonCanvas(day) {
  var k = Math.min(1, Math.max(0, (day - 1) / (CONFIG.days - 1)));   // 0 보름 ~ 1 그믐
  var cv = document.createElement('canvas'); cv.width = 16; cv.height = 16;
  var g = cv.getContext('2d');
  for (var y = 0; y < 16; y++) for (var x = 0; x < 16; x++) {
    var nx = (x - 7.5) / 6.5, ny = (y - 7.5) / 6.5;
    if (nx * nx + ny * ny > 1) continue;
    var w = Math.sqrt(1 - ny * ny);
    var lit = nx < w * (1 - 2 * k) + 0.0001;   // 기우는 달: 오른쪽부터 어두워짐
    if (k >= 0.999) lit = false;
    var edge = (nx * nx + ny * ny) > 0.78;
    g.fillStyle = lit ? (edge ? '#c9c3d6' : '#f1ece2') : (edge ? '#2a2633' : '#34303f');
    g.fillRect(x, y, 1, 1);
  }
  return cv;
}

  }
  if (p === 'settle') { if (!e.repeat && (code === 'Enter' || code === 'Space')) settleNext(); return; }
  if (p === 'payment') { if (!e.repeat && (code === 'Enter' || code === 'Space')) payNext(); return; }
  if (p === 'final') { if ((code === 'Enter') && performance.now() - ui.finalAt > 600) startNewRun(false); return; }
  if (p === 'shop' || (p === 'room' && run.room.kind === 'merchant')) {
    if (code === 'Enter') { if (p === 'shop') goNextDay(); else { Core.leaveRoom(run); afterAction(); } }
    var m = /^Digit([1-9])$/.exec(code);
    if (m) buyTool(+m[1] - 1);
    return;
  }
  if (p === 'room') { if (code === 'Digit1') { Core.springChoose(run, 'hp'); afterAction(); } if (code === 'Digit2') { Core.springChoose(run, 'candle'); afterAction(); } return; }
  if (ui.sub === 'fork') {
    if (code === 'ArrowLeft' || code === 'KeyA') { ui.sel = 0; renderOverlay(); }
    else if (code === 'ArrowRight' || code === 'KeyD') { ui.sel = 1; renderOverlay(); }
    else if (code === 'Digit1') forkGo(0); else if (code === 'Digit2') forkGo(1);
    else if (code === 'Enter') forkGo(ui.sel);
    return;
  }
  if (ui.sub === 'bag') { if (code === 'Tab') { ui.sub = null; renderOverlay(); } return; }
  if (ui.sub) return;
  if (code === 'Tab') { ui.sub = 'bag'; renderOverlay(); return; }
  bubbleOnAction();
  var k = keyAim();
  if (MOVE_KEYS[code]) { var mv = MOVE_KEYS[code]; Core.move(run, mv[0], mv[1]); var ka = keyAim(), kc = Core.cellAt(run.d.floor, ka.x, ka.y); ui.aim = kc && kc.cover !== 'open' ? ka : null; afterAction(); return; }
  if (code === 'Space') { if (!e.repeat) { var kc2 = Core.cellAt(run.d.floor, k.x, k.y); if (kc2 && kc2.mark === 1) say(TEXT.ops.xCell, k); else { Core.hit(run, k.x, k.y); afterAction(); } } return; }
  if (code === 'KeyF') { Core.mark(run, k.x, k.y); afterAction(); return; }
  if (code === 'Digit1') { if (modeOk('probe')) { Core.probe(run, k.x, k.y); afterAction(); } return; }
  if (code === 'KeyB') { Core.ignite(run, k.x, k.y); afterAction(); return; }
  var am = /^Digit([2-4])$/.exec(code);
  if (am) { Core.useCons(run, +am[1] - 2, k.x, k.y); afterAction(); return; }
  if (code === 'Enter' || code === 'NumpadEnter') { openFork(); return; }
  if (code === 'KeyR' && !e.repeat) askReturn();
});
OV.addEventListener('click', function (e) {
  if (!run || e.target.closest('button') || e.target.closest('[data-order]') || e.target.closest('[data-fork]') || e.target.closest('[data-buy]') || e.target.closest('[data-gift]')) return;
  flushAll();
  if (ui.opening != null) { openingNext(); return; }
  if (run.phase === 'settle') settleNext();
  else if (run.phase === 'payment') payNext();
});
function boardCell(e) {
  var r = board.getBoundingClientRect();
  var x = Math.floor((e.clientX - r.left) / r.width * BW), y = Math.floor((e.clientY - r.top) / r.height * BH);
  return x >= 0 && y >= 0 && x < BW && y < BH ? { x: x, y: y } : null;
}
board.addEventListener('mousemove', function (e) { var h = boardCell(e); if (!ui.hover || !h || h.x !== ui.hover.x || h.y !== ui.hover.y) ui.hudDirty = true; ui.hover = h; });
board.addEventListener('mouseleave', function () { ui.hover = null; ui.hudDirty = true; });
board.addEventListener('contextmenu', function (e) { e.preventDefault(); });
board.addEventListener('mousedown', function (e) {
  if (!run || run.phase !== 'mine' || ui.sub || ui.opening != null) return;
  flushAll(); bubbleOnAction();
  var p = boardCell(e); if (!p) return;
  if (e.button === 2) {   // 오른쪽 클릭: 고르기 상태면 취소, 아니면 분필 순환(거리 제한 없음)
    if (ui.mode) { ui.mode = null; ui.hudDirty = true; return; }
    var c = Core.cellAt(run.d.floor, p.x, p.y); if (c.cover !== 'open') { Core.mark(run, p.x, p.y); ui.chalkHintDone = true; } afterAction(); return;
  }
  if (e.button !== 0) return;
  clickCell(p);
});

// ---------- 루프 ----------
function frame(now) {
  if (run) {
    runSched(now);
    if (run.fx.length) drainFx();
    if (ui.bubble && now - ui.bubble.t0 > 7000) hideBubble();
    if (ui.hudDirty || ui.flys.length || (ui.streakFx && now - ui.streakFx.t0 < 600) || Object.keys(ui.slotPop).some(function (k) { return now - ui.slotPop[k] < 200; })) { ui.hudDirty = false; if (run.d || run.phase === 'deed' || run.phase === 'board') updateHUDSafe(); }
    if (run.d) { drawBoard(now); drawCandle(now); }
    drawTally();
    updateFlys(now);
    settleTick(now);
  }
  requestAnimationFrame(frame);
}
function updateHUDSafe() {
  if (!run.d) { // 아침 화면: 머리만
    $('dayTxt').innerHTML = run.day + '일째 <span class="muted">/ ' + CONFIG.days + '</span>';
    $('vaultTxt').innerHTML = '금고 <b class="px" style="font-size:14px">' + fmt(run.cash) + '</b>'; $('goalTxt').innerHTML = goalLine(run);
    return;
  }
  updateHUD();
}
fitStage();
startNewRun(!settings.tutorialDone);
requestAnimationFrame(frame);
</script>
