  .suSeed { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
  button.link { background: none; border: none; color: #a59fb3; text-decoration: underline; padding: 0; font-weight: 400; font-size: 13px; }
  button.link:hover { color: #f1ece2; }
  .suGo { position: absolute; right: 64px; bottom: 44px; }

  .card { padding: 8px 10px; display: flex; gap: 10px; align-items: center; cursor: pointer; }

  .card .n { font-size: 15px; font-weight: 700; }
  .card .d { font-size: 13px; color: #c9c3d6; margin-top: 2px; }
  .card .p { font-size: 16px; font-weight: 700; color: #ffd25a; min-width: 50px; text-align: right; }
  .card.sold { opacity: 0.45; cursor: default; }
  .card.sel { border-color: #ffd25a; }
  .fork { flex: 1; padding: 14px; cursor: pointer; min-height: 196px; position: relative; }
  .fork.sel { border-color: #ffd25a; background: #26222e; }
  .fork .nm { font-size: 19px; font-weight: 700; margin: 8px 0 4px; }
  .fork .tx { font-size: 15px; color: #efe7d6; line-height: 21px; }

  .fork .hp2 { min-height: 36px; }
  .forkNum { margin-top: 6px; color: #c9c3d6 !important; }
  .forkExtra { min-height: 26px; margin-top: 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .paper { background: #efe7d6; color: #1a120b; border: 2px solid #5a3d28; padding: 10px 12px; position: relative; cursor: pointer; }
  .paper.sel { outline: 3px solid #ffd25a; }
  .paper .pinI { position: absolute; left: 50%; top: -8px; transform: translateX(-50%); }
  .deedCard { background: #e9dfc8; color: #3a3542; border: 3px solid #3a3542; padding: 14px 18px; position: relative; }
  .deedCard .ttl { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .stampRow { display: flex; align-items: center; gap: 12px; font-size: 16px; margin: 6px 0; }

  .stamp { width: 44px; height: 44px; border-radius: 50%; border: 3px solid #b8322a; color: #b8322a; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; transform: rotate(-12deg); box-sizing: border-box; background: rgba(184,50,42,0.08); }
  .stamp.fall { animation: stampFall 0.38s ease-in forwards; }
  @keyframes stampFall { 0% { transform: rotate(-12deg) translateY(-60px) scale(1.6); opacity: 0; } 55% { transform: rotate(-12deg) translateY(0) scale(1); opacity: 1; } 70% { transform: rotate(-12deg) scale(1.08); } 100% { transform: rotate(-12deg) scale(1); opacity: 1; } }
  .voidLine { position: absolute; left: 14px; right: 14px; height: 4px; background: #e5484d; transform-origin: left; animation: strike 0.15s linear forwards; transform: scaleX(0); }

  .recFold { margin-top: 12px; border: 2px solid #34303f; padding: 6px 12px; }

  #cmodal .box { min-width: 340px; max-width: 480px; background: #1d1a24; border: 2px solid #34303f; padding: 18px 22px; font-size: 15px; line-height: 1.6; }

<div id="stage">

        <div id="candleBar"><i></i><s></s><b></b></div>
        <div id="embersRow"></div>
        <div id="candleCost"></div>
      </div>
    </div>

      <div class="prow" style="margin-top:4px"><div id="streakSteps"></div></div>
    </div>

      <div class="slots" id="ownSlots"></div>
